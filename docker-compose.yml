version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: imake-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: imake_user
      POSTGRES_PASSWORD: imake_secret_2024
      POSTGRES_DB: imake_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imake_user -d imake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
